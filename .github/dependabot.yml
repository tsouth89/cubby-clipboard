version: 2
updates:
  # Group only non-breaking updates. Major bumps open as individual PRs so they
  # can be reviewed (and rejected) without blocking security/patch traffic.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # TypeScript 7 removes tsconfig options Cubby currently uses, and i18next
    # 25 declares support for TypeScript 5 and 6 only. Keep receiving 5.x/6.x
    # updates while deferring this major until the frontend stack supports it.
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7 <8"
    open-pull-requests-limit: 10

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
