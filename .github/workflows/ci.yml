name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: 'ci-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so the audit tool cannot change under us on an unrelated run, and so
  # the cache key below is tied to an exact version. Bumping this string is what
  # forces a fresh compile.
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run release:check
      - run: pnpm run build
      - run: node .github/scripts/check-site.mjs
      - run: node .github/scripts/check-privileged-action-pins.mjs
      - run: node .github/scripts/check-shipped-windows-ci.mjs
      - run: pnpm run test
      - run: node --test product_pages/worker.test.mjs product_pages/analytics.test.mjs .github/scripts/check-privileged-action-pins.test.mjs .github/scripts/check-shipped-windows-ci.test.mjs
      - run: pnpm audit --prod
      # The rule that decides whether a live download URL may be overwritten.
      - name: Publish-guard rules
        shell: pwsh
        run: ./scripts/test-publish-guard.ps1
      # Compiling cargo-audit from source took 5m55s of a 9m17s job, to then run
      # for 7 seconds. Cache the built binary instead. The key pins the exact
      # version, so the only way to get a stale tool is to change the pin, which
      # misses the cache and rebuilds.
      - name: Cache cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit.exe
          key: ${{ runner.os }}-cargo-audit-${{ env.CARGO_AUDIT_VERSION }}

      - if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version ${{ env.CARGO_AUDIT_VERSION }}

      # Cheap insurance that a cache hit actually restored the tool we pinned,
      # so a bad entry fails here with a clear message rather than somewhere
      # inside the audit.
      - name: Verify cargo-audit
        shell: pwsh
        run: |
          $actual = (cargo audit --version | Out-String).Trim()
          # Match the version as a whole token, so a pin of 0.22.2 is not
          # satisfied by 0.22.20. Deliberately not anchored on the tool name:
          # the binary reports itself as "cargo-audit-audit <version>".
          $pattern = '(?:^|\s)' + [regex]::Escape($env:CARGO_AUDIT_VERSION) + '(?:\s|$)'
          if ($actual -notmatch $pattern) {
            throw "Expected cargo-audit $env:CARGO_AUDIT_VERSION on PATH, got: $actual"
          }
          Write-Host "cargo-audit verified: $actual"

      - shell: pwsh
        run: ./scripts/audit-rust.ps1
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  # SBS-779: compile every shipped Windows feature/arch pair on the PR, not
  # only at tag/release. cargo check is enough to catch cfg(feature =
  # "app-store") and target-specific breakage; the existing `test` job still
  # owns host x64 tests, clippy, and fmt.
  check-shipped-windows:
    name: Check ${{ matrix.arch }} ${{ matrix.features }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            features: default
            extra_args: ''
          - arch: x64
            target: x86_64-pc-windows-msvc
            features: app-store
            extra_args: --features app-store
          - arch: arm64
            target: aarch64-pc-windows-msvc
            features: default
            extra_args: ''
          - arch: arm64
            target: aarch64-pc-windows-msvc
            features: app-store
            extra_args: --features app-store
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Per-target, per-feature cache so the four legs and the `test` job
      # cannot clobber each other's src-tauri/target.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-check-${{ matrix.target }}-${{ matrix.features }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-${{ matrix.target }}-${{ matrix.features }}-
            ${{ runner.os }}-cargo-check-${{ matrix.target }}-

      - run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets ${{ matrix.extra_args }}
