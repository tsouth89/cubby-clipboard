name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: 'release-${{ github.ref }}'
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release candidate
    runs-on: windows-latest
    # Every job here is bounded. GitHub's default is six hours, so an
    # unbounded job that wedges burns most of a day before anyone is told.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      # Cache the cargo registry + src-tauri/target across runs so the cargo test
      # and clippy compiles below are incremental instead of cold every run.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # Install a prebuilt cargo-audit binary instead of compiling it from source
      # (cargo install cargo-audit) on every run.
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-audit

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run release:check
      - run: pnpm run build
      - run: pnpm audit --prod
      - shell: pwsh
        run: ./scripts/audit-rust.ps1
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # dev-harness is enabled here (but never for release bundles) so the
      # feature-gated diagnostic binaries stay compiled and linted.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --features dev-harness --all-targets
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --features dev-harness --all-targets -- -D warnings

  create-release:
    name: Create GitHub release
    # Intentionally does NOT depend on validate: the release object is only ever a
    # draft here, so it can be created in parallel with validation. publish-release
    # and submit-store both gate on validate, so an unvalidated build never
    # becomes public on GitHub or in Partner Center.
    runs-on: ubuntu-latest
    # Metadata only.
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Validate version and prepare release metadata
        id: metadata
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(node -e "const fs=require('fs'); const text=fs.readFileSync('src-tauri/Cargo.toml','utf8'); const match=text.match(/^version = \"([^\"]+)\"/m); if (!match) process.exit(1); process.stdout.write(match[1])")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$VERSION" != "$CARGO_VERSION" ] || [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Version mismatch: tauri=$VERSION cargo=$CARGO_VERSION package=$PACKAGE_VERSION"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=draft-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "name=Cubby Clipboard v${VERSION} test build" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            EXPECTED_TAG="v${VERSION}"
            if [ "${{ github.ref_name }}" != "$EXPECTED_TAG" ]; then
              echo "Tag ${{ github.ref_name }} does not match configured version $EXPECTED_TAG"
              exit 1
            fi
            echo "tag=$EXPECTED_TAG" >> "$GITHUB_OUTPUT"
            echo "name=Cubby Clipboard $EXPECTED_TAG" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
            if [[ "$VERSION" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          VERSION="${{ steps.metadata.outputs.version }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BODY="Test build for v${VERSION} from commit ${{ github.sha }}, signed with Azure Trusted Signing. For release-candidate testing only."
          else
            BODY=$(awk -v heading="## v${VERSION}" '
              $0 == heading { capture=1; next }
              capture && /^## v/ { exit }
              capture { print }
            ' CHANGELOG.md)
            if [ -z "$BODY" ]; then
              echo "CHANGELOG.md has no section for v${VERSION}"
              exit 1
            fi
          fi

          DELIMITER=$(openssl rand -hex 12)
          echo "body<<$DELIMITER" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "$DELIMITER" >> "$GITHUB_OUTPUT"

      - name: Remove previous test-build drafts
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "${{ github.repository }}" --limit 50 \
            --json tagName,isDraft,name \
            --jq '.[] | select(.isDraft and (.name | test("test build"))) | .tagName' \
          | while read -r tag; do
              if [ -n "$tag" ]; then
                echo "Deleting stale test-build draft: $tag"
                gh release delete "$tag" -R "${{ github.repository }}" --yes || true
              fi
            done

      - name: Create release
        id: release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.name }}
          body: ${{ steps.changelog.outputs.body }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ steps.metadata.outputs.prerelease }}

  build-installers:
    name: Build ${{ matrix.arch }} installer
    needs: create-release
    runs-on: windows-latest
    # A normal build is ~20 minutes; the arm64 compile alone is ~12. The
    # v1.3.0 attempt hung for 52 minutes inside the build-time signing command
    # with nothing on stdout, and would have run to the six-hour default had it
    # not been cancelled by hand. 45 leaves better than 2x headroom over a cold
    # cache while still failing a hang inside the hour.
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    env:
      # Tauri runs signCommand with captured stdio and discards it on failure,
      # so scripts/sign-windows.ps1 mirrors its output here and the "Dump the
      # signing log" step below surfaces it when a build fails.
      CUBBY_SIGN_LOG: ${{ github.workspace }}\sign-windows.log
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          # Wrangler 4.113+ requires Node 22 for R2 publication.
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      # Per-target cargo cache (keyed by matrix.target so x64 and arm64 don't
      # clobber each other) to keep the installer compiles incremental.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # Azure sign-in and the signing module must both be ready BEFORE any
      # bundle is built: tauri.conf.json's signCommand signs cubby.exe and the
      # NSIS uninstaller as part of the build, which is the only point at which
      # those files can still be signed before they are packed into the
      # installer. The `az login` this performs is also what supplies
      # credentials to Invoke-ArtifactSigning, via its DefaultAzureCredential
      # chain.
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Same module (and version) that Azure/artifact-signing-action@v2
      # installs for the post-build signing steps below, so in-build and
      # post-build signing share one mechanism. Installed once here rather than
      # per artifact, because signCommand runs for every file Tauri bundles.
      - name: Install the ArtifactSigning module
        shell: pwsh
        run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Force -Repository PSGallery

      - name: Build NSIS installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # createUpdaterArtifacts is on, so the build needs the updater key.
          # This produces a .sig over the UNSIGNED installer; it is regenerated
          # after Trusted Signing below so it matches the bytes users download.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Consumed by scripts/sign-windows.ps1 via signCommand.
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          # Fail the build rather than silently shipping unsigned binaries if
          # any of the three variables above is missing.
          CUBBY_REQUIRE_SIGNING: "1"
        with:
          projectPath: .
          args: --target ${{ matrix.target }} --bundles nsis

      - name: Locate the built installer
        id: installer
        shell: pwsh
        run: |
          $file = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $file) {
            Write-Error "No NSIS installer was produced"
            exit 1
          }
          $name = $file.Name -replace ' ', '.'
          $stagedPath = Join-Path $env:RUNNER_TEMP $name
          Copy-Item $file.FullName $stagedPath -Force
          $binary = Resolve-Path "src-tauri/target/${{ matrix.target }}/release/cubby.exe"

          # Verify the cubby.exe inside the installer, not the one on disk:
          # Tauri restores the unsigned original to target/release after packing
          # the signed copy, so the file here is NotSigned even on a good build.
          ./scripts/verify-installer-signature.ps1 -Installer $stagedPath -ExpectedSubject "CN=Brandon South, O=Brandon South, L=Wilmore, S=ky, C=US"

          # The dev-harness bins are feature-gated off, so nothing but the app
          # binary should be bundled. Catch any new stray executable that would
          # otherwise ride along into the install directory unsigned.
          $stray = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/*.exe" |
            Where-Object { $_.Name -ne "cubby.exe" }
          if ($stray) {
            Write-Error "Unexpected executables in the release directory: $($stray.Name -join ', ')"
            exit 1
          }

          $stagedBinary = Join-Path $env:RUNNER_TEMP "cubby-${{ matrix.arch }}.exe"
          Copy-Item $binary $stagedBinary -Force
          # Stage the slim installer before the Store build overwrites Tauri's
          # default NSIS output path and app binary.
          "path=$stagedPath" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          "binary_path=$stagedBinary" >> $env:GITHUB_OUTPUT

      - name: Build offline Microsoft Store installer
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          CUBBY_REQUIRE_SIGNING: "1"
        run: |
          pnpm tauri build `
            --ci `
            --target "${{ matrix.target }}" `
            --features app-store `
            --bundles nsis `
            --config src-tauri/tauri.store.conf.json

      - name: Locate the offline Store installer
        id: store-installer
        shell: pwsh
        run: |
          $file = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $file) {
            Write-Error "No offline NSIS installer was produced"
            exit 1
          }
          $name = "Cubby.Clipboard_${{ needs.create-release.outputs.version }}_${{ matrix.arch }}-Store-setup.exe"
          $stagedPath = Join-Path $env:RUNNER_TEMP $name
          Copy-Item $file.FullName $stagedPath -Force
          if ((Get-Item -LiteralPath $stagedPath).Length -lt 50MB) {
            Write-Error "Store installer is too small to contain the offline WebView2 runtime"
            exit 1
          }
          # The Store build is a second `tauri build`, so it runs signCommand
          # again over its own copy of the app binary. Verify it independently.
          ./scripts/verify-installer-signature.ps1 -Installer $stagedPath -ExpectedSubject "CN=Brandon South, O=Brandon South, L=Wilmore, S=ky, C=US"
          "path=$stagedPath" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      # Runs for a failure in either bundle build above. Without it a failing
      # signCommand reports only `failed to bundle project: failed to run pwsh`,
      # because Tauri captures the command's output and drops it on error.
      - name: Dump the signing log
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:CUBBY_SIGN_LOG) {
            Get-Content -LiteralPath $env:CUBBY_SIGN_LOG
          } else {
            Write-Host "No signing log at $env:CUBBY_SIGN_LOG - signCommand never reached scripts/sign-windows.ps1."
          }

      # The installers themselves are signed here rather than by signCommand,
      # because the Store installer is copied out to a staging path after the
      # build and the updater .sig has to be regenerated over the final bytes.
      - name: Sign the installers with Trusted Signing
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.store-installer.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload the signed installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          Copy-Item "${{ steps.installer.outputs.path }}" "${{ steps.installer.outputs.name }}"
          Copy-Item "${{ steps.store-installer.outputs.path }}" "${{ steps.store-installer.outputs.name }}"
          ./scripts/upload-release-asset.ps1 `
            -ReleaseId $env:RELEASE_ID `
            -AssetPath @(
              "${{ steps.installer.outputs.name }}",
              "${{ steps.store-installer.outputs.name }}"
            )

      - name: Re-sign the installer for the updater (over the signed bytes)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # The updater verifies a signature over the installer's exact bytes.
          # Trusted Signing changed those bytes after build, so regenerate the
          # .sig over the signed installer. Overwrites the build-time .sig.
          pnpm tauri signer sign --private-key "$env:TAURI_SIGNING_PRIVATE_KEY" --password "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "${{ steps.installer.outputs.path }}"
          Copy-Item "${{ steps.installer.outputs.path }}.sig" "${{ steps.installer.outputs.name }}.sig"

      - name: Upload the updater signature
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          ./scripts/upload-release-asset.ps1 `
            -ReleaseId $env:RELEASE_ID `
            -AssetPath "${{ steps.installer.outputs.name }}.sig"

      - name: Publish Microsoft Store installer to Cloudflare R2
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
        run: |
          foreach ($name in @(
            "CLOUDFLARE_API_TOKEN",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_R2_BUCKET"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "The release environment is missing $name."
            }
          }

          # The tag is passed, not a decision about it. Whether replacing an
          # existing object is allowed is settled inside the script, at the
          # moment of replacement, so the answer cannot go stale between here
          # and there.
          ./scripts/publish-store-installer.ps1 `
            -Version "${{ needs.create-release.outputs.version }}" `
            -Architecture "${{ matrix.arch }}" `
            -InstallerPath "${{ steps.store-installer.outputs.path }}" `
            -BucketName $env:CLOUDFLARE_R2_BUCKET `
            -ReleaseTag $env:TAG

      - name: Assemble the portable package
        if: matrix.arch == 'x64'
        id: portable
        shell: pwsh
        run: |
          $stage = Join-Path (Get-Location) "portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "${{ steps.installer.outputs.binary_path }}" (Join-Path $stage "Cubby Clipboard.exe")
          # The marker's presence next to the exe switches Cubby to portable mode.
          Set-Content -Path (Join-Path $stage "portable.txt") -Value @(
            "This file makes Cubby run in portable mode. Keep it next to Cubby Clipboard.exe.",
            "Your clipboard history is stored in the 'data' folder here, not in AppData."
          )
          Set-Content -Path (Join-Path $stage "README.txt") -Value @(
            "Cubby Clipboard - Portable",
            "",
            "Run 'Cubby Clipboard.exe'. Everything (history, settings, images, logs) is stored",
            "in the 'data' folder next to it, and nothing is written to AppData or the registry.",
            "",
            "UPDATING",
            "",
            "The portable version does not update itself. Download the newest portable ZIP and",
            "replace 'Cubby Clipboard.exe'. Keep the 'data' folder and 'portable.txt' next to",
            "it and your history, settings, and folders carry over.",
            "",
            "MOVING THIS FOLDER",
            "",
            "Your history is encrypted with the Windows account that created it, so this copy",
            "works fully on that PC and account. Carried to a different PC or Windows user,",
            "Cubby cannot read the existing history and will say so on launch instead of",
            "starting. Nothing is deleted. From there you can:",
            "",
            "  - Run it again from the original Windows account, or",
            "  - Back up your history from the original account (Settings > Back up history)",
            "    and import that backup on the new one, or",
            "  - Rename or move the 'data' folder to start a separate, empty history here.",
            "",
            "Requires Windows 10/11 (WebView2, which ships with Windows 11)."
          )
          "exe=$(Join-Path $stage 'Cubby Clipboard.exe')" >> $env:GITHUB_OUTPUT

      - name: Sign the portable executable
        if: matrix.arch == 'x64'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ steps.portable.outputs.exe }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Zip and upload the portable package
        if: matrix.arch == 'x64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          $zip = "Cubby-Clipboard-Portable-$($env:VERSION)-x64.zip"
          Compress-Archive -Path "portable/*" -DestinationPath $zip -Force
          ./scripts/upload-release-asset.ps1 -ReleaseId $env:RELEASE_ID -AssetPath $zip

  updater-manifest:
    name: Assemble updater manifest
    needs: [create-release, build-installers]
    runs-on: ubuntu-latest
    # Manifest assembly only.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build and upload latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ needs.create-release.outputs.tag }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          REPO="tsouth89/cubby-clipboard"
          NAME_X64="Cubby.Clipboard_${VERSION}_x64-setup.exe"
          NAME_ARM="Cubby.Clipboard_${VERSION}_arm64-setup.exe"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          download_asset() {
            local name="$1"
            local destination="$2"
            local asset_id
            asset_id=$(gh api "repos/${REPO}/releases/${RELEASE_ID}/assets?per_page=100" \
              --jq ".[] | select(.name == \"${name}\") | .id")
            if [ -z "$asset_id" ] || [[ "$asset_id" == *$'\n'* ]]; then
              echo "Expected exactly one release asset named ${name}"
              exit 1
            fi
            gh api "repos/${REPO}/releases/assets/${asset_id}" \
              -H "Accept: application/octet-stream" > "$destination"
          }

          mkdir -p sigs
          download_asset "${NAME_X64}.sig" "sigs/${NAME_X64}.sig"
          download_asset "${NAME_ARM}.sig" "sigs/${NAME_ARM}.sig"
          SIG_X64=$(cat "sigs/${NAME_X64}.sig")
          SIG_ARM=$(cat "sigs/${NAME_ARM}.sig")
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg v "$VERSION" --arg d "$PUB_DATE" \
            --arg sx "$SIG_X64" --arg ux "${BASE}/${NAME_X64}" \
            --arg sa "$SIG_ARM" --arg ua "${BASE}/${NAME_ARM}" \
            '{version:$v, pub_date:$d, platforms:{"windows-x86_64":{signature:$sx,url:$ux},"windows-aarch64":{signature:$sa,url:$ua}}}' \
            > latest.json

          existing_id=$(gh api "repos/${REPO}/releases/${RELEASE_ID}/assets?per_page=100" \
            --jq '.[] | select(.name == "latest.json") | .id')
          if [ -n "$existing_id" ]; then
            gh api "repos/${REPO}/releases/assets/${existing_id}" --method DELETE --silent
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=latest.json" \
            > /dev/null

  submit-store:
    name: Submit Microsoft Store update
    if: github.event_name != 'workflow_dispatch'
    # SBS-1068: this job runs `msstore submission publish` into Partner Center.
    # Gate on validate the same way publish-release gates GitHub undraft. A red
    # or still-running cargo test / clippy / release:check must not reach the
    # Store. create-release and build-installers stay independent of validate
    # so the draft release and installer builds can still run in parallel.
    needs: [validate, create-release, build-installers]
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        if: vars.MICROSOFT_STORE_SUBMISSION_ENABLED == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Microsoft Store Developer CLI
        if: vars.MICROSOFT_STORE_SUBMISSION_ENABLED == 'true'
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Configure Partner Center credentials
        if: vars.MICROSOFT_STORE_SUBMISSION_ENABLED == 'true'
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          foreach ($name in @(
            "PARTNER_CENTER_TENANT_ID",
            "PARTNER_CENTER_SELLER_ID",
            "PARTNER_CENTER_CLIENT_ID",
            "PARTNER_CENTER_CLIENT_SECRET"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "The release environment is missing secret $name."
            }
          }
          msstore settings --enableTelemetry false
          msstore reconfigure `
            --tenantId $env:PARTNER_CENTER_TENANT_ID `
            --sellerId $env:PARTNER_CENTER_SELLER_ID `
            --clientId $env:PARTNER_CENTER_CLIENT_ID `
            --clientSecret $env:PARTNER_CENTER_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Store CLI authentication failed."
          }

      - name: Prepare Microsoft Store package update
        if: vars.MICROSOFT_STORE_SUBMISSION_ENABLED == 'true'
        shell: pwsh
        env:
          PARTNER_CENTER_PRODUCT_ID: ${{ vars.PARTNER_CENTER_PRODUCT_ID }}
          STORE_VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PARTNER_CENTER_PRODUCT_ID)) {
            throw "The release environment is missing variable PARTNER_CENTER_PRODUCT_ID."
          }
          $currentPath = Join-Path $env:RUNNER_TEMP "store-packages-current.json"
          $preparedPath = Join-Path $env:RUNNER_TEMP "store-packages-prepared.json"
          msstore submission get $env:PARTNER_CENTER_PRODUCT_ID > $currentPath
          if ($LASTEXITCODE -ne 0) {
            throw "Could not retrieve Cubby's current Microsoft Store packages."
          }
          & .\scripts\prepare-store-submission.ps1 `
            -CurrentPackagePath $currentPath `
            -Version $env:STORE_VERSION `
            -OutputPath $preparedPath
          "STORE_PACKAGE_PATH=$preparedPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Submit update to Microsoft Store
        if: vars.MICROSOFT_STORE_SUBMISSION_ENABLED == 'true'
        shell: pwsh
        env:
          PARTNER_CENTER_PRODUCT_ID: ${{ vars.PARTNER_CENTER_PRODUCT_ID }}
        run: |
          $package = Get-Content -LiteralPath $env:STORE_PACKAGE_PATH -Raw
          msstore submission update $env:PARTNER_CENTER_PRODUCT_ID $package
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Store package update failed."
          }
          msstore submission publish $env:PARTNER_CENTER_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Store submission failed."
          }
          "### Submitted Cubby Clipboard to Microsoft Store" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  publish-release:
    name: Publish validated release
    if: github.event_name != 'workflow_dispatch'
    # Gate publishing on validate too, since create-release/build no longer do.
    needs: [validate, create-release, build-installers, updater-manifest, submit-store]
    runs-on: ubuntu-latest
    # A single release edit.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}" \
            --method PATCH \
            -F draft=false \
            --silent
