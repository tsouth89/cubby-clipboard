[package]
name = "backup-export-harness"
version = "0.0.0"
edition = "2021"
publish = false
description = "Linux-runnable unit tests for encrypted backup full-resolution originals (SBS-919)"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.3"
hmac = "0.12"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "chrono", "uuid", "runtime-tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.9.0", features = ["derive"] }
